# Coolify: create a "Docker Compose" resource from this repository.
# - SERVICE_FQDN_EXPOSR_8080 makes Coolify assign a domain (with HTTPS) to the admin UI.
# - SERVICE_PASSWORD_* are generated by Coolify and kept in the resource's env.
# Running it yourself: copy .env.example to .env, fill it, `docker compose up -d --build`.

services:
  exposr:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_EXPOSR_8080
      - MONGODB_URI=mongodb://exposr:${SERVICE_PASSWORD_MONGO}@mongo:27017/?authSource=admin
      - MONGODB_DB=exposr
      # Hostname/IP your clients use to reach this server (shown in the UI).
      - PUBLIC_HOST=${PUBLIC_HOST}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${SERVICE_PASSWORD_ADMIN}
      # Must match the published range below.
      - SERVICE_PORT_RANGE=${SERVICE_PORT_RANGE:-20000-20099}
    ports:
      # Tunnel control port (clients connect here, TLS).
      - "2333:2333"
      # Public ports for your services (TCP and UDP).
      - "${SERVICE_PORT_RANGE:-20000-20099}:${SERVICE_PORT_RANGE:-20000-20099}/tcp"
      - "${SERVICE_PORT_RANGE:-20000-20099}:${SERVICE_PORT_RANGE:-20000-20099}/udp"
    volumes:
      - exposr-data:/data
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_ROOT_USERNAME=exposr
      - MONGO_INITDB_ROOT_PASSWORD=${SERVICE_PASSWORD_MONGO}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  exposr-data:
  mongo-data:
